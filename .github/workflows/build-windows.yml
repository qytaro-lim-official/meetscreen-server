
name: Build MeetScreen for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MeetScreen EXE
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Build Windows application
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/project" \
            -w /project \
            electronuserland/builder:wine \
            /bin/bash -lc '
              set -e
              npm install --no-audit --no-fund
              npx electron-builder --win --dir --publish never
            '

      - name: Verify Windows executable
        run: |
          test -f dist/win-unpacked/MeetScreen.exe
          echo "MeetScreen.exe successfully created!"

      - name: Create ZIP archive
        run: |
          cd dist
          zip -r "$GITHUB_WORKSPACE/MeetScreen-Windows.zip" win-unpacked

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: MeetScreen-Windows
          path: MeetScreen-Windows.zip
          if-no-files-found: error
          retention-days: 14
