
name: Build MeetScreen for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Build Windows EXE using Wine
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            electronuserland/builder:wine \
            /bin/bash -lc "npm ci && npm run build:win"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MeetScreen-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
