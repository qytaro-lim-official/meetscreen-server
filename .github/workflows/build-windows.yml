
name: Build MeetScreen for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MeetScreen EXE
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Build Windows application
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/project" \
            -w /project \
            electronuserland/builder:wine \
            /bin/bash -lc '
              set -e

              echo "================================"
              echo "Installing MeetScreen dependencies"
              echo "================================"

              npm install --no-audit --no-fund

              echo "================================"
              echo "Building Windows installer"
              echo "================================"

              npm run build:win

              echo "================================"
              echo "Build completed"
              echo "================================"
            '

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MeetScreen-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
